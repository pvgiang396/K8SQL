<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>K8SQL</title>
<link rel="icon" type="image/png" href="/assets/sql.png" />
<style>
  :root {
    --bg: #ffffff;
    --bg-alt: #f5f6f8;
    --border: #d9dce1;
    --border-soft: #e7e9ec;
    --text: #1b1f24;
    --text-dim: #6b7280;
    --accent: #2563eb;
    --accent-fg: #ffffff;
    --danger: #dc2626;
    --danger-bg: #fef2f2;
    --result-header-bg: #bac0cc;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      --bg: #1b1f24;
      --bg-alt: #23272e;
      --border: #343a42;
      --border-soft: #2b2f36;
      --text: #e6e8eb;
      --text-dim: #9aa1ab;
      --accent: #3b82f6;
      --accent-fg: #0b0e12;
      --danger: #f87171;
      --danger-bg: #3a1d1d;
    }
  }
  :root[data-theme="dark"] {
    --bg: #1b1f24; --bg-alt: #23272e; --border: #343a42; --border-soft: #2b2f36;
    --text: #e6e8eb; --text-dim: #9aa1ab; --accent: #3b82f6; --accent-fg: #0b0e12;
    --danger: #f87171; --danger-bg: #3a1d1d;
  }
  :root[data-theme="light"] {
    --bg: #ffffff; --bg-alt: #f5f6f8; --border: #d9dce1; --border-soft: #e7e9ec;
    --text: #1b1f24; --text-dim: #6b7280; --accent: #2563eb; --accent-fg: #ffffff;
    --danger: #dc2626; --danger-bg: #fef2f2;
  }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--text);
    display: flex;
    flex-direction: column;
    overflow: hidden;
  }
  /* Header tách 2 khối thẳng hàng với sidebar (trái, 270px) + query panel (phải) bên dưới —
     Execute/Clear nằm ở khối phải, bắt đầu ngay từ mép trái của query panel (xem layout.png). */
  header {
    display: flex;
    align-items: stretch;
    border-bottom: 1px solid var(--border);
    background: var(--bg-alt);
    flex: 0 0 auto;
  }
  header .header-left {
    /* +5px = đúng width `.divider-v` (#dividerH, thanh chia dọc) — để border-right dưới đây thẳng
       hàng với đường line do `.divider-v::after` tự vẽ (nằm ở MÉP PHẢI #dividerH, khớp điểm bắt đầu
       của `.divider-h::after` bên #dividerV), không phải mép trái/giữa #dividerH. Xem chi tiết root
       cause trong k8sql/CLAUDE.md Phase 9 mục 1 (bug thứ 4). */
    width: calc(var(--aside-width, 270px) + 5px);
    flex: 0 0 auto;
    display: flex;
    align-items: center;
    gap: 10px;
    padding: 6px 14px;
    border-right: 1px solid var(--border);
  }
  header .header-right {
    flex: 1 1 auto;
    display: flex;
    align-items: center;
    padding: 6px 14px;
    min-width: 0;
  }
  header .header-actions {
    display: flex;
    align-items: center;
    gap: 2px;
  }
  header .header-actions .divider {
    width: 1px;
    align-self: stretch;
    margin: 4px 4px;
    background: linear-gradient(to bottom, transparent, var(--border) 20%, var(--border) 80%, transparent);
    opacity: .8;
  }
  header .icon-btn {
    background: none;
    border: none;
    padding: 5px;
    border-radius: 6px;
    cursor: pointer;
    font-size: 17px;
    line-height: 1;
    display: inline-flex;
    align-items: center;
    justify-content: center;
  }
  header .icon-btn:hover { background: var(--border-soft); }
  header .icon-btn:disabled { opacity: .4; cursor: default; }
  header .icon-btn:hover:disabled { background: none; }
  header .icon-btn img { width: 16px; height: 16px; object-fit: contain; }
  header #btnExecute { color: #16a34a; }
  header #btnExecute:disabled { color: var(--text-dim); }
  header #btnClear { font-size: 15px; }
  header img.logo { width: 18px; height: 18px; }
  header h1 { font-size: 14px; margin: 0; font-weight: 600; white-space: nowrap; }
  header .status { font-size: 12px; color: var(--text-dim); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; margin-left: auto; }

  main {
    flex: 1 1 auto;
    display: flex;
    min-height: 0;
  }
  aside {
    width: var(--aside-width, 270px);
    flex: 0 0 auto;
    display: flex;
    flex-direction: column;
    background: var(--bg-alt);
  }
  /* Thanh chia kéo-resize giữa aside/query-panel (chiều ngang, con trỏ col-resize) và giữa
     #editor/#resultsWrap (chiều dọc, con trỏ row-resize) — xem setupDivider() ở <script> bên dưới.
     Kéo ghi trực tiếp vào biến CSS --aside-width/--editor-height trên :root nên áp dụng đồng nhất
     cho mọi tab (không phải per-tab state).
     Đường line hiển thị (::after, 1px) do CHÍNH divider tự vẽ — bug thật đã gặp (2026-08-10): dựa
     vào border của element LÂN CẬN (aside/`#editor` border-right/border-bottom) để tạo đường line
     tĩnh khiến trên WebKitGTK (app thật, khác Chromium lúc test bằng Playwright) render hở/lệch
     ngay chỗ 2 divider giao nhau — tự vẽ line bằng chính divider loại bỏ hẳn phụ thuộc render giữa
     2 element khác nhau. */
  .divider-v, .divider-h { position: relative; }
  /* background var(--bg-alt) (KHÔNG phải transparent) — #dividerH nằm giữa aside (nền --bg-alt) và
     query-panel (nền --bg trắng); để transparent lộ ra khoảng trắng 5px không khớp màu 2 bên, xem
     bug thật đã gặp trong k8sql/CLAUDE.md Phase 9 mục 1 (bug thứ 5). */
  .divider-v { flex: 0 0 auto; width: 5px; cursor: col-resize; background: var(--bg-alt); }
  /* right:0 (KHÔNG phải left/center) — phải khớp CHÍNH XÁC mép phải #dividerH, đúng vị trí
     query-panel/#dividerV bắt đầu (`.divider-h::after` bên dưới dùng left:0 trong #dividerV) để 2
     đường line chạm nhau tại điểm giao; cũng khớp `header .header-left`'s border-right (đã +5px ở
     trên) — cả 3 điểm neo cùng 1 toạ độ x duy nhất. */
  .divider-v::after { content: ""; position: absolute; top: 0; bottom: 0; right: 0; width: 1px; background: var(--border); }
  .divider-v:hover::after, .divider-v.dragging::after { background: var(--accent); }
  .divider-h { flex: 0 0 auto; height: 5px; cursor: row-resize; background: transparent; }
  .divider-h::after { content: ""; position: absolute; left: 0; right: 0; top: 2px; height: 1px; background: var(--border); }
  .divider-h:hover::after, .divider-h.dragging::after { background: var(--accent); }
  aside h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--text-dim); margin: 0; padding: 8px 10px 4px; }
  /* border-bottom thường sẽ dừng đúng mép phải aside (x = --aside-width), hụt 5px so với đường dọc
     .divider-v::after thật (x = --aside-width + 5px, vẽ ở mép phải #dividerH nằm SAU aside) — cùng
     bản chất bug đã fix ở header .header-left phía trên, dùng ::after riêng để kéo dài thêm 5px.
     Bug thật đã gặp + fix (2026-08-14, chỉ thấy trên WebKitGTK thật qua screenshot+đo pixel, không
     thấy qua Chromium/Playwright — verify bằng `import -window` (ImageMagick) + PIL đọc pixel trực
     tiếp, đúng cách đã dùng cho các bug đường line khác ở Phase 9):
     1. `right: -5px` KHÔNG hoạt động trên WebKitGTK — đo pixel cho thấy line dừng đúng tại mép phải
        `.filter-row` (không kéo dài thêm chút nào), hụt nguyên 5px so với `.divider-v::after`. Fix:
        đổi sang `width: calc(100% + 5px)` (định nghĩa trực tiếp bề rộng thay vì offset âm).
     2. Line render DÀY 2px thay vì 1px (2 hàng pixel cùng màu đặc, không phải viền mờ do
        anti-alias) — do `height:1px; background` trên absolutely-positioned div không snap đúng
        lưới pixel thiết bị khi tổng chiều cao `.filter-row` (padding + input) ra số lẻ dưới
        devicePixelRatio không nguyên. So sánh đối chứng: `.divider-v::after` (cùng kỹ thuật nhưng
        nằm trong flex item có width cố định 5px) vẫn render đúng 1px — chứng tỏ không phải lỗi
        DPR toàn cục. Fix: đổi `height:1px; background` sang `border-top: 1px solid` (browser hint
        border thành hairline đúng lưới pixel thiết bị, khác cách rasterize 1 rect nền thường). */
  aside .filter-row { padding: 6px 8px; position: relative; }
  aside .filter-row::after { content: ""; position: absolute; left: 0; width: calc(100% + 5px); bottom: 0; height: 0; border-top: 1px solid var(--border); z-index: 1; }
  aside input[type="text"] {
    width: 100%;
    padding: 6px 8px;
    border-radius: 3px;
    border: 1px solid var(--border);
    background: var(--bg);
    color: var(--text);
    font-size: 12px;
  }
  #tree { flex: 1 1 auto; overflow: auto; padding: 4px; font-size: 12.5px; }
  #tree .empty { padding: 10px; color: var(--text-dim); }
  .node { user-select: none; }
  .node-row {
    display: flex;
    align-items: center;
    gap: 5px;
    padding: 3px 6px;
    border-radius: 5px;
    cursor: pointer;
    white-space: nowrap;
  }
  .node-row:hover { background: var(--border-soft); }
  .node-row.active { background: var(--accent); color: var(--accent-fg); }
  .node-row .caret {
    display: inline-flex;
    width: 12px;
    height: 12px;
    flex: 0 0 auto;
    align-items: center;
    justify-content: center;
    color: var(--text-dim);
    transition: transform .12s ease;
  }
  .node-row .caret svg { width: 10px; height: 10px; }
  .node-row.active .caret { color: inherit; }
  .node-row.expanded > .caret { transform: rotate(90deg); }
  .node-row .icon { flex: 0 0 auto; font-size: 12px; opacity: .8; }
  .node-row .icon.node-icon-img { width: 14px; height: 14px; opacity: 1; object-fit: contain; }
  /* Icon connection Mongo cấp 1 to hơn các icon khác (18x18 thay vì 14x14, theo yêu cầu user
     2026-08-05) — asset public/assets/mongodb.png cũng được xuất native ở 18x18 (không phải
     upscale qua CSS từ file nhỏ hơn) để nét, không mờ. */
  .node-row .icon.node-icon-img[src$="mongodb.png"] { width: 18px; height: 18px; }
  .node-row .label { overflow: hidden; text-overflow: ellipsis; }
  .node-row .col-type { color: var(--text-dim); font-size: 11px; margin-left: 4px; }
  .node-row .copy-btn {
    margin-left: auto;
    flex: 0 0 auto;
    padding: 1px 4px;
    font-size: 12px;
    opacity: 0;
    border: none;
    background: none;
    border-radius: 4px;
    color: inherit;
    cursor: pointer;
  }
  .node-row:hover .copy-btn { opacity: .7; }
  .node-row .copy-btn:hover { opacity: 1 !important; }
  .node-row.active .copy-btn:hover { background: rgba(255,255,255,.25); }
  .node-children { margin-left: 16px; }
  .node-loading, .node-empty { padding: 3px 6px 3px 22px; color: var(--text-dim); font-size: 11.5px; font-style: italic; }
  /* Dòng "Xem thêm" cuối 1 danh sách lazy-load (schema/database, table/collection, column) — xem
     createLazyList(). Cùng convention "Xem thêm" của bảng kết quả tràn chữ (.cell-toggle). */
  .node-more { padding: 3px 6px 3px 22px; color: var(--accent); font-size: 11.5px; cursor: pointer; }
  .node-more:hover { text-decoration: underline; }

  section.query-panel { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; }

  /* Thanh tab query — mỗi tab 1 EditorView + 1 result pane riêng (xem <script>, createTab()). Nút
     "+" cuối danh sách tab mở dropdown 2 mục Query SQL/Query NoSQL, cùng convention .sm-icon-plus
     của settings-modal (ký tự "+" trực tiếp, không tạo asset PNG mới). */
  /* border-bottom cũ đã bỏ (2026-08-10) — trùng lặp với `header`'s border-bottom (đã tách riêng
     cách nhau ~1px, trên WebKitGTK render thành "đường đúp" ngay dưới thanh công cụ khi tabBar rỗng
     — xem ghi chú ở .divider-v/.divider-h phía trên). Phân tách tabBar/editor vẫn rõ nhờ màu nền
     --bg-alt khác --bg, không cần thêm border riêng. */
  #tabBar { display: flex; align-items: stretch; background: var(--bg-alt); flex: 0 0 auto; }
  #tabList { display: flex; flex: 1 1 auto; min-width: 0; overflow-x: auto; }
  .tab-item {
    display: flex; align-items: center; gap: 6px; padding: 0 8px 0 10px;
    border-right: 1px solid var(--border-soft); cursor: pointer; font-size: 12.5px;
    white-space: nowrap; max-width: 220px; flex: 0 0 auto;
  }
  .tab-item:hover { background: var(--border-soft); }
  .tab-item.active { background: var(--bg); border-bottom: 2px solid var(--accent); }
  .tab-item .tab-icon { width: 14px; height: 14px; flex: 0 0 auto; object-fit: contain; }
  .tab-item .tab-label { overflow: hidden; text-overflow: ellipsis; }
  .tab-item .tab-close {
    flex: 0 0 auto; border: none; background: none; cursor: pointer; color: var(--text-dim);
    font-size: 13px; line-height: 1; padding: 3px; border-radius: 4px;
  }
  .tab-item .tab-close:hover { background: var(--border-soft); color: var(--text); }
  .tab-item.active .tab-close:hover { background: var(--border); }
  /* #btnNewTab nay nằm trong header .header-actions — dùng chung style "header .icon-btn"/
     "header .icon-btn img" đã có sẵn (không cần CSS riêng nữa). .tab-new-wrap chỉ còn cần
     position:relative để neo .dropdown-menu. */
  .tab-new-wrap { position: relative; flex: 0 0 auto; display: flex; align-items: center; }
  .dropdown-menu {
    position: absolute; top: 100%; right: 0; margin-top: 2px; background: var(--bg);
    border: 1px solid var(--border); border-radius: 5px; box-shadow: 0 4px 12px rgba(0,0,0,.15);
    min-width: 150px; z-index: 50; padding: 4px;
  }
  .dropdown-menu[hidden] { display: none; }
  .dropdown-menu button {
    display: block; width: 100%; text-align: left; background: none; border: none;
    padding: 7px 9px; border-radius: 4px; cursor: pointer; font-size: 12.5px; color: var(--text);
  }
  .dropdown-menu button:hover { background: var(--border-soft); }

  #editor {
    flex: 0 0 auto; height: var(--editor-height, 320px); min-height: 120px; max-height: 70vh;
    overflow: hidden; display: flex; flex-direction: column;
  }
  .editor-pane { flex: 1 1 auto; min-height: 0; overflow: auto; }
  .editor-pane[hidden] { display: none; }
  /* Không còn tự mở sẵn 1 tab lúc load trang (yêu cầu SRS — mặc định "SQL" sai lệch khi dùng nhiều
     loại DB) — 2 placeholder này hiện khi tabs.length === 0 (xem updateEmptyState()), tránh màn
     hình trắng trông như lỗi. */
  .pane-empty { display: flex; align-items: center; justify-content: center; height: 100%; color: var(--text-dim); font-size: 13px; text-align: center; padding: 20px; }
  .pane-empty[hidden] { display: none; }
  .cm-editor { height: 100%; font-size: 13px; }
  /* CodeMirror 6 tự quản lý focus ring qua .cm-focused, bỏ outline mặc định trình duyệt để lại
     ở đây (không dùng *:focus{outline:none} toàn trang — sẽ phá accessibility ở chỗ khác). */
  .cm-editor.cm-focused { outline: none !important; }
  /* Chữ hoa CHỈ HIỂN THỊ — thay cho auto-uppercase bằng JS (EditorState.transactionFilter) đã bỏ
     hẳn vì bug nhân đôi ký tự khi gõ nhanh (xem CLAUDE.md mục "Giới hạn cần biết"). CSS không đụng
     view.state.doc nên nội dung thật gửi lên server/copy-paste vẫn giữ nguyên hoa/thường đã gõ. */
  #editor .cm-content { text-transform: uppercase; }
  /* Mongo query (db.collection.find({...})) là JS, không phải SQL keyword — tắt uppercase-hiển-thị
     khi tab đang dùng engine "mongo" (mỗi tab tự set class này trên .editor-pane của chính nó lúc
     tạo/rebind — nhiều tab có thể khác engine cùng lúc, xem createTab()/bindTabToEnv()). */
  .editor-pane.mongo-mode .cm-content { text-transform: none; }

  /* Bỏ padding ngang để bảng tràn sát 2 mép query panel (giống editor/header) — phần text/pager
     có padding riêng qua .results-meta-row/.pager-row để không dính sát mép. #resultsWrap chứa
     nhiều .results-pane con (1 pane/tab, xem createTab()) — chỉ pane của tab active không có
     [hidden] nên tự chiếm hết flex:1 1 auto của #resultsWrap, không cần position:absolute. */
  #resultsWrap { flex: 1 1 auto; overflow: hidden; min-height: 0; display: flex; flex-direction: column; }
  .results-pane { flex: 1 1 auto; min-height: 0; overflow: hidden; display: flex; flex-direction: column; }
  .results-pane[hidden] { display: none; }
  .results-meta-row { padding: 10px 12px 8px; flex: 0 0 auto; }
  .resultsMeta { font-size: 12px; color: var(--text-dim); margin-bottom: 8px; }
  .resultsMeta.error { color: var(--danger); background: var(--danger-bg); padding: 8px 10px; border-radius: 6px; }
  .resultsTableWrap { flex: 1 1 auto; overflow: auto; }
  table.result-table { border-collapse: collapse; font-size: 12px; width: 100%; }
  table.result-table th, table.result-table td {
    border: 1px solid var(--border);
    padding: 4px 8px;
    text-align: left;
    vertical-align: top;
  }
  table.result-table th { background: var(--result-header-bg); color: #1b1f24; position: sticky; top: 0; white-space: nowrap; max-width: 360px; overflow: hidden; text-overflow: ellipsis; }
  table.result-table td { max-width: 360px; }
  table.result-table td.cell-expanded { max-width: none; }
  table.result-table td.null-value { color: var(--text-dim); font-style: italic; }
  /* .cell-value giữ style truncate (thay vì đặt trực tiếp trên td) để có thể toggle riêng khi bấm
     "Xem thêm" — xem setupExpandableCells(). */
  table.result-table .cell-value {
    display: inline-block;
    max-width: 100%;
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
    vertical-align: bottom;
  }
  table.result-table .cell-value.expanded {
    white-space: normal;
    overflow: visible;
    text-overflow: clip;
    word-break: break-word;
  }
  table.result-table .cell-toggle {
    display: block;
    margin-top: 2px;
    background: none;
    border: none;
    color: var(--accent);
    font-size: 11px;
    cursor: pointer;
    padding: 0;
  }
  table.result-table .cell-toggle:hover { text-decoration: underline; }
  table.result-table td.stt-col, table.result-table th.stt-col {
    background: var(--result-header-bg);
    color: #1b1f24;
    font-weight: 600;
    text-align: center;
    width: 1%;
    white-space: nowrap;
  }
  table.result-table th.stt-col { position: sticky; left: 0; top: 0; z-index: 1; }
  table.result-table td.stt-col { position: sticky; left: 0; }

  .pager-row {
    display: flex;
    align-items: center;
    gap: 8px;
    padding: 8px 12px;
    border-bottom: 1px solid var(--border);
    font-size: 12px;
    color: var(--text-dim);
    flex: 0 0 auto;
  }
  .pager-row .icon-btn { font-size: 13px; padding: 4px 8px; border: 1px solid var(--border); border-radius: 6px; color: var(--text); }
  .pager-row .icon-btn:hover { background: var(--border-soft); }
  .pager-row .icon-btn:disabled { opacity: .4; cursor: default; }
  .pager-row .icon-btn:hover:disabled { background: none; }

  /* JSON tree — kết quả query MongoDB (thay bảng khi environment đang chọn là engine "mongo"), xem
     public/vendor/json-tree.js. Mỗi document 1 khối riêng, cách nhau bằng border-bottom. */
  .jsonResultsWrap { padding: 10px 12px; font-size: 12.5px; font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; }
  .json-doc { padding: 8px 0; border-bottom: 1px solid var(--border-soft); }
  .json-doc:last-child { border-bottom: none; }
  .json-row { display: flex; align-items: baseline; gap: 2px; white-space: pre; }
  .json-children { margin-left: 18px; }
  .json-toggle { display: inline-block; width: 12px; color: var(--text-dim); user-select: none; }
  .json-key { color: var(--text-dim); }
  .json-bracket { color: var(--text-dim); font-style: italic; }
  .json-value.json-string { color: #16a34a; }
  .json-value.json-number { color: #2563eb; }
  .json-value.json-boolean { color: #d97706; }
  .json-value.json-null { color: var(--text-dim); font-style: italic; }
  .json-value.json-objectId, .json-value.json-date { color: #7c3aed; }

  /* Thanh action (view/edit/delete) trên mỗi document Mongo — xem buildDocActionBar()/
     renderResultJsonTree(). Icon xoá/sửa chỉ render khi env.allowWrite=true (xem
     buildDocActionBar()), icon xem luôn có mặt. */
  .doc-action-bar { display: flex; justify-content: flex-end; gap: 2px; margin-bottom: 2px; }
  .doc-action-bar .icon-btn { font-size: 12px; padding: 2px 5px; line-height: 1; }

  /* Modal "Cấu hình" — markup/CSS/JS thật nằm ở public/shared/settings-modal.* (dùng chung với
     scripts/wizard.html của quickstart, xem k8sctl/CLAUDE.md mục "Settings"), chỉ giữ overlay +
     box wrapper ở đây. */
  .modal-overlay {
    position: fixed; inset: 0; background: rgba(0,0,0,.45);
    display: flex; align-items: center; justify-content: center; z-index: 100;
  }
  .modal-overlay[hidden] { display: none; }
  .modal-box {
    background: var(--bg); color: var(--text); border: 1px solid var(--border);
    border-radius: 5px; width: 768px; max-width: calc(100vw - 32px);
    /* 270px = chiều ngang menu trái (aside) hiện tại — giá trị cố định, không đồng bộ theo
       --aside-width nếu user kéo-resize sau này (xem #dividerH). */
    min-height: 270px;
    max-height: calc(100vh - 64px); overflow-y: auto;
    box-shadow: 0 10px 30px rgba(0,0,0,.25);
  }

  /* Popup "Xem JSON" (icon trước giá trị JSON trong bảng kết quả query, xem renderResultTable()) —
     kích thước cố định 900x600 theo yêu cầu, khác .modal-box mặc định (768px, cao theo nội dung). */
  .modal-box.json-view-box {
    width: 900px; height: 600px;
    display: flex; flex-direction: column;
    max-height: calc(100vh - 64px);
  }
  .json-view-header {
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 16px; border-bottom: 1px solid var(--border); flex: 0 0 auto;
  }
  .json-view-header h3 { margin: 0; font-size: 14px; }
  .json-view-body {
    flex: 1 1 auto; overflow: auto; padding: 12px 16px;
  }
  .json-view-icon {
    cursor: pointer; margin-right: 4px; font-size: 12px;
  }

  /* Popup xem/sửa 1 document Mongo (icon view/edit trên buildDocActionBar()) — kích thước mặc định
     1060x600 (khác 900x600 của #jsonViewModal ở trên, theo yêu cầu riêng), có nút phóng to toàn màn
     hình/thu nhỏ về mặc định (chưa có pattern resize/fullscreen nào khác trong file này). */
  .modal-box.doc-modal-box {
    width: 1060px; height: 600px;
    display: flex; flex-direction: column;
    max-height: calc(100vh - 64px);
  }
  .modal-box.doc-modal-box.fullscreen {
    width: 100vw; height: 100vh; max-width: 100vw; max-height: 100vh; border-radius: 0;
  }
  .doc-modal-body {
    flex: 1 1 auto; overflow: auto; padding: 12px 16px;
  }
  .doc-modal-textarea {
    width: 100%; height: 100%; box-sizing: border-box; resize: none;
    font-family: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace; font-size: 12.5px;
    border: 1px solid var(--border); border-radius: 4px; padding: 8px;
    background: var(--bg); color: var(--text);
  }
  .doc-modal-textarea[readonly] { background: var(--bg-alt); }
  .doc-modal-footer {
    display: flex; justify-content: flex-end; gap: 8px;
    padding: 10px 16px; border-top: 1px solid var(--border); flex: 0 0 auto;
  }
  .doc-modal-error { color: #dc2626; font-size: 12px; margin-right: auto; align-self: center; }

[package]
name = "k8sql"
version = "0.1.0"
description = "Desktop shell cho k8sql — Tauri + Node sidecar, kế thừa backend k8sctl"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["full"] }
# native_bridge.rs (Phase 3) — 1 HTTP loopback server duy nhất cho mọi tính năng cần Rust-side API
# gọi từ sidecar Node (secret keychain, toggle autostart, ...), thay vì mở nhiều server riêng lẻ.
axum = "0.7"
rand = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
keyring = "3"

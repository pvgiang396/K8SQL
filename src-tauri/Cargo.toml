[package]
name = "k8sql"
version = "0.1.0"
description = "Desktop shell cho k8sql — Tauri + Node sidecar, kế thừa backend k8sctl"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-shell = "2"
tauri-plugin-dialog = "2"
tauri-plugin-autostart = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
reqwest = { version = "0.12", default-features = false, features = ["json"] }
tokio = { version = "1", features = ["full"] }
# native_bridge.rs (Phase 3) — 1 HTTP loopback server duy nhất cho mọi tính năng cần Rust-side API
# gọi từ sidecar Node (secret keychain, toggle autostart, ...), thay vì mở nhiều server riêng lẻ.
axum = "0.7"
rand = "0.8"

[target.'cfg(not(any(target_os = "android", target_os = "ios")))'.dependencies]
# Bug thật đã gặp + fix: `keyring = "3"` KHÔNG kèm feature nào — mặc định crate KHÔNG thật sự bật
# backend D-Bus Secret Service trên Linux (biên dịch được, PUT trả 204 "thành công" nhưng KHÔNG
# persist — GET lại bằng 1 Entry MỚI luôn trả rỗng, chỉ đọc lại đúng khi dùng LẠI CHÍNH Entry object
# vừa ghi, tức rơi vào 1 kiểu lưu tạm trong bộ nhớ tiến trình chứ không phải OS keychain thật). Đã tự
# verify bằng binary Rust test riêng: thiếu feature → bug; thêm "sync-secret-service"+"tokio"+
# "crypto-rust" → persist đúng qua Entry mới (test round-trip). "apple-native"/"windows-native" cho
# macOS/Windows (chưa tự test được, chỉ có máy Linux) — mỗi feature chỉ compile trên đúng target của
# nó, để chung không gây lỗi biên dịch cho platform khác.
keyring = { version = "3", features = ["sync-secret-service", "tokio", "crypto-rust", "apple-native", "windows-native"] }

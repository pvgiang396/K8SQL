name: Build K8SQL

on:
  workflow_dispatch:
    inputs:
      targets:
        description: "Comma-separated targets: linux,windows,macos"
        required: true
        default: "linux,windows,macos"

permissions:
  contents: read

jobs:
  linux:
    if: contains(inputs.targets, 'linux')
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libayatana-appindicator3-dev libwebkit2gtk-4.1-dev librsvg2-dev patchelf
          npm ci
          npm --prefix server ci
      - run: npm run build -- --targets linux
      - uses: actions/upload-artifact@v4
        with:
          name: k8sql-linux
          path: dist/**/*
          if-no-files-found: error

  windows:
    if: contains(inputs.targets, 'windows')
    runs-on: windows-2025
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - name: Install dependencies
        shell: bash
        run: |
          npm ci
          npm --prefix server ci
      - run: npm run build -- --targets win32
      - uses: actions/upload-artifact@v4
        with:
          name: k8sql-windows
          path: dist/**/*
          if-no-files-found: error

  macos:
    if: contains(inputs.targets, 'macos')
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: |
            package-lock.json
            server/package-lock.json
      - uses: dtolnay/rust-toolchain@stable
      - uses: taiki-e/install-action@v2
        with:
          tool: tauri-cli@2
      - name: Install dependencies
        run: |
          npm ci
          npm --prefix server ci
      - run: npm run build -- --targets darwin
      - uses: actions/upload-artifact@v4
        with:
          name: k8sql-macos
          path: dist/**/*
          if-no-files-found: error
